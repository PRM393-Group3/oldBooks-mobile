name: Android release

# - Push to `production`: build a signed APK and keep it as a workflow artifact.
# - Push a tag `vX.Y.Z`: build, then publish a GitHub Release with the APK.
#   The tag must match `version:` in pubspec.yaml (e.g. 1.0.0+1 -> v1.0.0).
on:
  push:
    branches: [production]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  APP_DIR: books_marketplace_mobile

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read app version
        id: version
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name=${full%%+*}
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version v$name"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Empty repo variable falls back to the staging URL in lib/core/config/env.dart.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          args=(--release)
          if [[ -n "$API_BASE_URL" ]]; then
            args+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          flutter build apk "${args[@]}"
          out="oldbook-${{ steps.version.outputs.name }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "APK_PATH=$APP_DIR/$out" >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: oldbook-apk-${{ steps.version.outputs.full }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" "$APK_PATH.sha256" \
            --title "Oldbook $GITHUB_REF_NAME (Android)" \
            --generate-notes \
            --verify-tag
